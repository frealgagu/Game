apply plugin: 'com.android.application'

// La versión sale de package.json: versionName "1.7.2", versionCode 10702 (mayor·10000 + menor·100 + parche).
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (major, minor, patch) = pkg.version.tokenize('.').collect { it as int }

android {
    namespace = "com.frealgagu.mitierrita.encantos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.frealgagu.mitierrita.encantos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clave de las versiones de prueba: todos los APK tienen la misma firma y se instalan encima del
    // anterior sin perder la partida. Llega por variables de entorno (en GitHub Actions, desde los
    // secretos del repositorio; ver .github/workflows/pages.yml). Mientras no existan, se usa la de
    // pruebas guardada en el repositorio (temporal: se cambiará por los secretos con Google Play).
    def keystore = System.getenv('MITIERRITA_KEYSTORE') ?: (file('mitierrita-pruebas.keystore').exists() ? 'mitierrita-pruebas.keystore' : null)
    def fromEnv = System.getenv('MITIERRITA_KEYSTORE') != null
    if (keystore) {
        signingConfigs {
            pruebas {
                storeFile file(keystore)
                storePassword fromEnv ? System.getenv('MITIERRITA_KEYSTORE_PASSWORD') : 'android'
                keyAlias fromEnv ? System.getenv('MITIERRITA_KEY_ALIAS') : 'androiddebugkey'
                keyPassword fromEnv ? System.getenv('MITIERRITA_KEY_PASSWORD') : 'android'
            }
        }
    }
    // Clave de subida a Google Play (el AAB de la tienda): solo llega por variables de entorno, desde los
    // secretos PLAY_UPLOAD_* del repositorio. Google firma después con su propia clave (Play App Signing).
    def uploadKeystore = System.getenv('MITIERRITA_UPLOAD_KEYSTORE')
    if (uploadKeystore) {
        signingConfigs {
            subida {
                storeFile file(uploadKeystore)
                storePassword System.getenv('MITIERRITA_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MITIERRITA_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('MITIERRITA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (keystore) signingConfig signingConfigs.pruebas
        }
        release {
            if (uploadKeystore) signingConfig signingConfigs.subida
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
