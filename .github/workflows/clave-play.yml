name: Crear la clave de subida a Google Play

# Se ejecuta a mano una sola vez (Actions → «Crear la clave de subida a Google Play» → Run workflow).
# Genera la clave de subida con contraseñas aleatorias y la guarda directamente en los secretos del
# repositorio (PLAY_UPLOAD_*), sin que nadie la vea ni quede en el código. Necesita el secreto
# SECRETS_TOKEN: un token de GitHub de grano fino con permiso «Secrets: Read and write» sobre este
# repositorio (se borra después). Si los secretos ya existen no hace nada, para no perder la clave.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clave:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Revisar que no exista ya
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto SECRETS_TOKEN."; exit 1; fi
          if gh secret list --json name -q '.[].name' | grep -qx PLAY_UPLOAD_KEYSTORE_BASE64; then
            echo "::error::La clave de subida ya existe; no se reemplaza. Bórrala a mano si de verdad quieres otra."
            exit 1
          fi
      - name: Generar la clave y guardarla en los secretos
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          pass=$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-32)
          echo "::add-mask::$pass"
          alias=subida
          keytool -genkeypair -v -storetype PKCS12 -keystore "$dir/subida.p12" -alias "$alias" \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$pass" -keypass "$pass" \
            -dname "CN=Encantos de Mi Tierrita, O=frealgagu, C=CO"
          base64 -w0 "$dir/subida.p12" | gh secret set PLAY_UPLOAD_KEYSTORE_BASE64
          printf '%s' "$pass" | gh secret set PLAY_UPLOAD_KEYSTORE_PASSWORD
          printf '%s' "$pass" | gh secret set PLAY_UPLOAD_KEY_PASSWORD
          printf '%s' "$alias" | gh secret set PLAY_UPLOAD_KEY_ALIAS
          mkdir -p certificado
          keytool -exportcert -rfc -keystore "$dir/subida.p12" -alias "$alias" -storepass "$pass" > certificado/subida.pem
          keytool -printcert -file certificado/subida.pem | tee certificado/huellas.txt
          rm -rf "$dir"
      # Solo la parte pública (sirve para comprobar en Play Console que la clave coincide).
      - uses: actions/upload-artifact@v4
        with:
          name: certificado-subida
          path: certificado
