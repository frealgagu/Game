name: Publicar la web y la app de Android

# En cada push: pruebas y web (GitHub Pages) por un lado, APK de Android por otro, y al final se
# publican juntos: el APK queda en la misma página, en ./mitierrita.apk (el menú del juego lo enlaza).
# Si existen los secretos de la clave de subida (PLAY_UPLOAD_*, ver clave-play.yml), también se genera el
# AAB para Google Play (./mitierrita.aab): sin el aviso de actualización propio, porque Play actualiza solo.
on:
  push:
    branches: [main, claude/frozen-city-supply-chain-game-jpdsxh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
      - run: npm ci
      # Clave de pruebas: de los secretos del repositorio (ANDROID_KEYSTORE_BASE64, …) si existen; si no,
      # la que está temporalmente en android/app (ver build.gradle).
      - env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mitierrita.keystore"
            {
              echo "MITIERRITA_KEYSTORE=$RUNNER_TEMP/mitierrita.keystore"
              echo "MITIERRITA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MITIERRITA_KEY_ALIAS=$KEY_ALIAS"
              echo "MITIERRITA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      # Compila el juego, lo copia a android/ y genera el APK firmado con la clave de pruebas.
      - run: |
          npm run android:apk
          cp android/app/build/outputs/apk/debug/app-debug.apk mitierrita.apk
      # AAB para Google Play, firmado con la clave de subida (solo si están los secretos).
      - env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          MITIERRITA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          MITIERRITA_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          MITIERRITA_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin clave de subida: no se genera el AAB."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subida.p12"
          export MITIERRITA_UPLOAD_KEYSTORE="$RUNNER_TEMP/subida.p12"
          PLAY_STORE=1 npm run android:sync
          (cd android && ./gradlew bundleRelease)
          cp android/app/build/outputs/bundle/release/app-release.aab mitierrita.aab
          rm "$RUNNER_TEMP/subida.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mitierrita.a*

  deploy:
    needs: [web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
