name: Publicar la web y la app de Android

# En cada push: pruebas y web (GitHub Pages) por un lado, APK de Android por otro, y al final se
# publican juntos: el APK queda en la misma página, en ./cafetal.apk (el menú del juego lo enlaza).
on:
  push:
    branches: [main, claude/frozen-city-supply-chain-game-jpdsxh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0
      - run: npm ci
      # La clave de pruebas sale de los secretos del repositorio (ANDROID_KEYSTORE_BASE64, …). Sin ella
      # no se publica APK (uno firmado con otra clave no se podría instalar encima del anterior).
      - id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64: esta vez no se publica el APK."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cafetal.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # Compila el juego, lo copia a android/ y genera el APK firmado con la clave de pruebas.
      - if: steps.key.outputs.ok == 'true'
        env:
          CAFETAL_KEYSTORE: ${{ runner.temp }}/cafetal.keystore
          CAFETAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAFETAL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAFETAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run android:apk
          cp android/app/build/outputs/apk/debug/app-debug.apk cafetal.apk
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: cafetal.apk

  deploy:
    needs: [web, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      # El APK, si se pudo firmar (ver el paso «key» de android).
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
